[package]
name = "tax_customer_management"
version = "1.0.0"
description = "Offline-First Tax Customer Management System"
authors = ["Arslan Tax & Corporate Advisory Services"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
